version: 2

updates:
  # SvelteKit, Vite and Bun all move fast; weekly is often enough to notice a break while
  # the change that caused it is still small.
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # SvelteKit 3's sync step needs the compiler API that TypeScript 7 removed
      - dependency-name: typescript
        versions: ['>=7']
      # the oldest Node in `engines`, so the compiler rejects APIs Node 22 lacks
      - dependency-name: '@types/node'
        versions: ['>=23']
    groups:
      # one PR per family, so a review is about a change rather than a version bump
      sveltekit:
        patterns:
          - '@sveltejs/*'
          - svelte
          - svelte-check
      tooling:
        patterns:
          - eslint*
          - '@eslint/*'
          - typescript-eslint
          - prettier*
          - vitest
          - '@vitest/*'
          - '@playwright/test'
          - playwright
      docs:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'
          - mdsvex
          - shiki
          - rehype-*
          - '@orama/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
